<section class="card mx-auto p-4" style="max-width: 28rem" aria-labelledby="login-title">
  <h2 id="login-title">Sign in</h2>
  <p>Use your ShopMate account to open your lists.</p>
  @if (registered) {
    <p class="alert alert-success" role="status">Account created. Sign in with your new details.</p>
  }
  @if (errorMessage()) {
    <p class="alert alert-danger" role="alert">{{ errorMessage() }}</p>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label" for="login-username">Username</label>
      <input class="form-control" id="login-username" formControlName="username"
        autocomplete="username" required />
    </div>
    <div class="mb-3">
      <label class="form-label" for="login-password">Password</label>
      <input class="form-control" id="login-password" type="password" formControlName="password"
        autocomplete="current-password" required />
    </div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>
    <p class="mt-3 mb-0"><a routerLink="/register">Create an account</a></p>
  </form>
</section>
