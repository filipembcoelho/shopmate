<article class="item-card">
  <div class="item-top">
    <span class="item-icon" aria-hidden="true">✦</span>
    <span class="item-number">#{{ shoppingListItemInner().id }}</span>
  </div>

  <h3>{{ shoppingListItemInner().name }}</h3>

  @if (shoppingListItemInner().purchased) {
    <strong class="status-done">✓ Purchased</strong>
  } @else {
    <span class="status-pending">○ Not yet purchased</span>
  }

  @if (showDetails()) {
    <p class="item-details">Quantity: {{ shoppingListItemInner().quantity }}</p>
  }

  <div class="actions">
    <button type="button" class="details-button" (click)="toggleDetails()">
      Show or hide details
    </button>
    <button type="button" class="status-button" (click)="requestToggle()">
      Change status
    </button>
  </div>
</article>
