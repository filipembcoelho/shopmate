<article class="rounded-3 border bg-body-tertiary p-3">
  <div class="d-flex align-items-start justify-content-between gap-2 mb-2">
    <div>
      <span class="small text-body-secondary">#{{ shoppingListItemInner().id }}</span>
      <h4
        class="h6 fw-semibold mb-0"
        [class.text-decoration-line-through]="shoppingListItemInner().purchased"
      >
        {{ shoppingListItemInner().name | titlecase }}
      </h4>
    </div>
    @if (shoppingListItemInner().purchased) {
      <span class="badge text-bg-success">
        <i class="bi bi-check-circle me-1" aria-hidden="true"></i>Purchased
      </span>
    } @else {
      <span class="badge text-bg-secondary">To buy</span>
    }
  </div>

  @if (showDetails()) {
    <p class="small text-body-secondary mb-2">
      Quantity: {{ shoppingListItemInner().quantity | quantityLabel }}
    </p>
  }

  <div class="d-flex flex-wrap gap-2 mt-3">
    <button type="button" class="btn btn-outline-success btn-sm" (click)="toggleDetails()">
      {{ showDetails() ? 'Hide details' : 'Show details' }}
    </button>
    <button type="button" class="btn btn-success btn-sm" (click)="requestToggle()">
      {{ shoppingListItemInner().purchased ? 'Mark as needed' : 'Mark as purchased' }}
    </button>
  </div>
</article>
