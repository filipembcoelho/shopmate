<section class="card h-100 border-0 shadow-sm">
  <div class="card-body p-4">
    <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-4">
      <div>
        <p class="small fw-semibold text-success text-uppercase mb-1">Shopping list</p>
        <h3 class="h4 fw-bold mb-0">{{ shoppingList().title }}</h3>
      </div>
      <span class="badge text-bg-light border">{{ shoppingList().items.length }} items</span>
    </div>

    <div class="vstack gap-3">
      @for (item of shoppingList().items; track item.id) {
        <app-shopping-item
          [shoppingListItemInner]="item"
          (toggleRequested)="requestToggle($event)"
        ></app-shopping-item>
      } @empty {
        <p class="alert alert-info mb-0">No products in this list yet.</p>
      }
    </div>
  </div>
</section>
