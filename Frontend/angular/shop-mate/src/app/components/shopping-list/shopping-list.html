<section class="card shopmate-list h-100 border-0">
  <div class="card-body p-4">
    <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
      <div>
        <p class="small fw-bold text-success text-uppercase mb-2">Shopping list</p>
        <h3 class="h4 fw-bold mb-0">{{ shoppingList().title }}</h3>
      </div>
      <span class="badge rounded-pill text-bg-light border px-3 py-2">
        {{ shoppingList().items.length }} {{ shoppingList().items.length === 1 ? 'item' : 'items' }}
      </span>
    </div>

    <div class="vstack gap-3">
      @for (item of shoppingList().items; track item.id) {
        <app-shopping-item
          [shoppingListItemInner]="item"
          (toggleRequested)="requestToggle($event)"
        ></app-shopping-item>
      } @empty {
        <div class="shopmate-list-empty text-center p-4">
          <i class="bi bi-card-checklist fs-2 text-success" aria-hidden="true"></i>
          <p class="fw-semibold mt-2 mb-1">A fresh start</p>
          <p class="small text-body-secondary mb-0">No products in this list yet.</p>
        </div>
      }
    </div>

    <app-add-item-form [listId]="shoppingList().id"></app-add-item-form>

    <div class="d-flex flex-wrap gap-2 border-top mt-4 pt-3">
      <a class="btn btn-outline-success btn-sm" [routerLink]="['/lists', shoppingList().id, 'edit']">
        <i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Edit list
      </a>
      <button
        class="btn btn-outline-danger btn-sm"
        type="button"
        (click)="deleteRequested.emit(shoppingList().id)"
      >
        <i class="bi bi-trash3 me-1" aria-hidden="true"></i>Delete list
      </button>
    </div>
  </div>
</section>
